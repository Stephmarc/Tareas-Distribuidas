server:
  http_listen_port: 9080
positions:
  filename: /tmp/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: catalogo
    static_configs:
      - targets: [localhost]
        labels:
          application: pagatu-catalogo-ms
          __path__: /logs/catalogo/*.log
  - job_name: orden
    static_configs:
      - targets: [localhost]
        labels:
          application: pagatu-orden-ms
          __path__: /logs/orden/*.log
  - job_name: cliente
    static_configs:
      - targets: [localhost]
        labels:
          application: pagatu-cliente-ms
          __path__: /logs/cliente/*.log
  - job_name: pago
    static_configs:
      - targets: [localhost]
        labels:
          application: pagatu-pago-ms
          __path__: /logs/pago/*.log
  - job_name: keycloak
    static_configs:
      - targets: [localhost]
        labels:
          application: pagatu-keycloak
          __path__: /logs/keycloak/*.log
