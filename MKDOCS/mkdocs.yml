      - S02 · Configuración centralizada: S02/index.md
      - S03 · Eureka: S03/index.md
      - Revisión y pendientes S04–S05: Unidad1/auditoria.md
  - Unidad 2:
      - Presentación: Unidad2/index.md
      - S06 · Comunicación síncrona resiliente: Unidad2/S06/index.md
      - S07 · Seguridad distribuida y control de acceso: Unidad2/S07/index.md
      - S08 · Mensajería asíncrona entre servicios: Unidad2/S08/index.md
      - S09 · Consistencia distribuida en procesos de negocio: Unidad2/S09/index.md
      - S10 · Observabilidad y diagnóstico: Unidad2/S10/index.md
      - S11 · Integración del cliente Angular con Keycloak: Unidad2/S11/index.md
      - Pruebas realizadas: Unidad2/verificacion.md
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
