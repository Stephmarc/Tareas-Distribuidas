site_name: "Evidencias - Sistemas Distribuidos"
site_description: "Evidencias individuales de las sesiones del curso de Sistemas Distribuidos"

theme:
  name: material
  language: es
  features:
    - navigation.sections
    - navigation.top
    - toc.integrate

nav:
  - S01 - Evidencia individual: index.md
  - S02 - Configuración centralizada: S02/index.md
  - S03 - Registro y descubrimiento con Eureka: S03/index.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
