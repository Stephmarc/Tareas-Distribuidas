site_name: "Tarea personal · Jannys Navarro"
site_description: "Trabajo individual · Casa o Nada"
site_author: Jannys Graciela Navarro Acrota
repo_url: https://github.com/Stephmarc/Tareas-Distribuidas
site_url: https://stephmarc.github.io/Tareas-Distribuidas/
theme:
  name: material
  language: es
  palette:
    primary: teal
    accent: teal
  features:
