server:
  port: 8084
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15435/pagatu_pago_db}
    username: ${DB_USER:pagatu}
    password: ${DB_PASSWORD:pagatu}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:18090/realms/pagatu}
eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:18761/eureka/}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
logging:
  file:
    name: logs/pago.log
  pattern:
    level: "%5p [traceId=%X{traceId}]"
spring.kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:19092}
spring.kafka.consumer.group-id: pagatu-pago
spring.kafka.consumer.auto-offset-reset: earliest
spring.kafka.consumer.key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer: org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer: org.apache.kafka.common.serialization.StringSerializer
